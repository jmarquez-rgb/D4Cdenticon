  let FM = null;
  function famModal(pid) {
    const p = P(pid); const ids = (p.members || [pid]).filter(i => state.patients[i]);

  function famPlans() {
    // find start times where every selected appt has a free chair (distinct chairs)
    const appts = FM.list.filter(a => FM.sel.includes(a.id)); if (!appts.length) return [];
    const per = appts.map(a => { const pt = P(a.pid); return D.freeSlots(state, a.office, FM.date, a.type, age(pt)); });
    const times = per[0].map(s => s.start).filter((t, i, arr) => arr.indexOf(t) === i).filter(t => per.every(list => list.some(s => s.start === t)));
    return times.map(t => { const used = []; const asg = []; let ok = true; appts.forEach((a, i) => { const c = per[i].find(s => s.start === t && !used.includes(s.office + s.op)); if (!c) { ok = false; return; } used.push(c.office + c.op); asg.push({ appt: a, slot: c }); }); return ok ? { t, asg } : null; }).filter(Boolean);
  }
  function drawFam() {

  function go(v, pid) { S.view = v; if (pid) { S.pid = pid; S.office = P(pid).office; } render(); }

      case 'thread': S.thread = id; render(); break;
      case 'sendsms': { const v = $('smsin').value.trim(); if (v) { D.addSms(state, id, v, 'Front Desk (Denticon user)'); save(); render(); } break; }
      case 'viewreg': { const r = state.regs.find(x => x.id === id); const d = r.data; modal('Online registration ' + r.id, '<table class="t"><tr><th colspan="2">Patient</th></tr><tr><td>Name</td><td>' + esc(d.first + ' ' + d.last) + '</td></tr><tr><td>DOB / Sex</td><td>' + fmtDate(d.dob) + ' / ' + d.sex + '</td></tr><tr><td>Address</td><td>' + esc(d.addr + ', ' + d.city + ', ' + d.st + ' ' + d.zip) + '</td></tr><tr><td>Referral source</td><td>' + esc(d.referral) + '</td></tr><tr><td>Preferred language</td><td>' + d.language + '</td></tr><tr><th colspan="2">Responsible party</th></tr><tr><td>Name / Cell</td><td>' + esc(d.respName) + ' / ' + d.cell + '</td></tr><tr><td>Email</td><td>' + esc(d.email) + '</td></tr><tr><th colspan="2">Dental insurance (primary)</th></tr><tr><td>Carrier / Group</td><td>' + esc(d.ins.carrier) + ' / ' + d.ins.group + '</td></tr><tr><td>Subscriber / Member ID</td><td>' + esc(d.ins.subscriber) + ' (' + d.ins.rel + ') / ' + d.ins.memberId + '</td></tr></table><div class="warn">Entered by: ' + esc(r.source) + '. Front desk reviews and accepts to create the chart.</div>', '<button class="btn light" data-act="closeModal">Close</button>'); break; }
      case 'acceptreg': { const pid = D.acceptReg(state, id); save(); S.pid = pid; S.office = P(pid).office; S.view = 'overview'; render(); toast('Registration accepted. Patient ' + pid + ' created.'); break; }
      case 'runelig': D.log ? 0 : 0; state.apiLog.unshift({ t: new Date().toLocaleTimeString(), name: 'Eligibility 270/271 (clearinghouse)', params: { MemberID: P(id).ins.memberId, Carrier: P(id).ins.carrier }, result: { Active: true } }); save(); toast('Eligibility refreshed: ACTIVE.'); render(); break;
      case 'closeModal': closeModal(); break;
      case 'drawer': $('drawer').classList.toggle('on'); drawer(); break;
      case 'applysc': { const n = el.dataset.n; if (state.applied.includes(n)) { toast('Already applied. Use Reset to run it again.'); break; } const ids = D.applyScenario(state, +n); state.applied.push(n); save(); S.flash = ids || []; if (+n === 2) { S.view = 'regs'; } else if (ids && ids.length) { const a = state.appts.find(x => x.id === ids[0]); S.date = a.date; S.office = a.office; S.view = 'scheduler'; S.sel = ids[0]; } render(); drawer(); toast('Scenario ' + n + ' result applied.'); break; }
      case 'resetall': reset(); S.sel = null; S.flash = []; S.view = 'scheduler'; S.date = state.today; S.pid = null; render(); drawer(); toast('Demo data reset.'); break;
      case 'datacheck': dataCheck(); break;
    }
  });
  $('modalbg').addEventListener('click', e => { if (e.target.id === 'modalbg') closeModal(); });
  function render() {
    renderChrome();
    ({ scheduler: renderScheduler, overview: renderOverview, ledger: renderLedger, chart: renderChart, notes: renderNotes, comms: renderComms, regs: renderRegs, elig: renderElig }[S.view] || renderScheduler)();
    if ($('drawer').classList.contains('on')) drawer();
    save();
  }
  init(); render();
  window.D4CDEMO = { state: () => state, S };
})();
</script>
</body></html>
